backend:
  name: github
  repo: ashmano19/ahmed-shaban-portfolio
  branch: main
  base_url: https://ahmedshaban-ph.com
  auth_endpoint: auth
locale: ar
media_folder: images/uploads
public_folder: /images/uploads
collections:
  - name: content
    label: محتوى الموقع
    files:
      - name: gallery
        label: "الصور (المعرض)"
        file: content/gallery.json
        fields:
          - name: photos
            label: الصور
            widget: list
            summary: "{{fields.title_ar}}"
            fields:
              - {name: image, label: الصورة, widget: image}
              - {name: thumb, label: صورة مصغرة, widget: image, required: false}
              - {name: video, label: رابط فيديو (embed), widget: string, required: false}
              - {name: preview, label: "معاينة الفيديو (mp4 قصير يشتغل لوحده)", widget: string, required: false}
              - {name: cover, label: "صورة غلاف القسم (تظهر برا بس)", widget: boolean, required: false, default: false}
              - {name: group, label: "رقم المجموعة (خط فاصل ذهبي لما الرقم يتغير)", widget: number, value_type: int, required: false}
              - {name: title_ar, label: العنوان بالعربي, widget: string, required: false}
              - {name: title_en, label: العنوان بالإنجليزي, widget: string, required: false}
              - {name: category, label: التصنيف, widget: relation, collection: content, file: categories, value_field: "categories.*.id", search_fields: ["categories.*.name_ar"], display_fields: ["categories.*.name_ar"]}
      - name: featured
        label: "صور مميزة (تظهر في الرئيسية)"
        file: content/featured.json
        fields:
          - name: items
            label: الصور المميزة
            widget: list
            summary: "{{fields.title_ar}}"
            fields:
              - {name: image, label: الصورة, widget: image}
              - {name: title_ar, label: العنوان بالعربي, widget: string, required: false}
              - {name: title_en, label: العنوان بالإنجليزي, widget: string, required: false}
              - {name: category, label: التصنيف, widget: relation, collection: content, file: categories, value_field: "categories.*.id", search_fields: ["categories.*.name_ar"], display_fields: ["categories.*.name_ar"], required: false}
      - name: categories
        label: التصنيفات
        file: content/categories.json
        fields:
          - name: categories
            label: التصنيفات
            widget: list
            summary: "{{fields.name_ar}}"
            fields:
              - {name: id, label: "معرّف (بالإنجليزي بدون مسافات)", widget: string}
              - {name: name_ar, label: الاسم بالعربي, widget: string}
              - {name: name_en, label: الاسم بالإنجليزي, widget: string}
      - name: settings
        label: الإعدادات العامة
        file: content/settings.json
        fields:
          - {name: name_ar, label: الاسم بالعربي, widget: string}
          - {name: name_en, label: الاسم بالإنجليزي, widget: string}
          - {name: tagline_ar, label: الشعار بالعربي, widget: string}
          - {name: tagline_en, label: الشعار بالإنجليزي, widget: string}
          - {name: hero_image, label: صورة الغلاف, widget: image}
      - name: downloads
        label: "Downloads (التحميلات)"
        file: content/downloads.json
        fields:
          - name: items
            label: الصفحات / الروابط
            widget: list
            summary: "{{fields.title}}"
            fields:
              - {name: title, label: العنوان, widget: string}
              - {name: slug, label: "اسم الصفحة في الرابط (إنجليزي بدون مسافات)", widget: string, required: false, hint: "لو تركته فاضي، يتم فتح الرابط الخارجي بدلاً من صفحة داخلية"}
              - {name: cover, label: صورة الغلاف, widget: image, required: false}
              - {name: video, label: "رابط فيديو للتضمين (YouTube embed)", widget: string, required: false}
              - {name: body, label: المحتوى, widget: markdown, required: false}
              - {name: images, label: صور إضافية, widget: list, required: false, field: {name: image, label: صورة, widget: image}}
              - {name: download_url, label: رابط التحميل, widget: string, required: false}
              - {name: url, label: "رابط خارجي (اختياري)", widget: string, required: false}
      - name: contact
        label: بيانات التواصل
        file: content/contact.json
        fields:
          - {name: email, label: البريد, widget: string, required: false}
          - {name: phone, label: الهاتف, widget: string, required: false}
          - {name: whatsapp, label: "واتساب (أرقام فقط مع كود الدولة)", widget: string, required: false}
          - {name: instagram, label: رابط إنستجرام, widget: string, required: false}
          - {name: facebook, label: رابط فيسبوك, widget: string, required: false}
          - {name: behance, label: رابط بيهانس, widget: string, required: false}
      - name: mano
        label: "MANO (صفحة الأداة)"
        file: content/mano.json
        fields:
          - {name: show, label: إظهار الصفحة, widget: boolean, default: true}
          - {name: menu_ar, label: "الاسم في قائمة Download بالعربي", widget: string, required: false}
          - {name: menu_en, label: "الاسم في قائمة Download بالإنجليزي", widget: string, required: false}
          - {name: site_url, label: "رابط موقع MANO", widget: string, required: false, hint: "موقع MANO المستقل (https://mano-plugin.pages.dev). زر MANO في قائمة Download بيفتحه. نص/أسعار/روابط التحميل والاشتراك هنا بتظهر في موقع MANO تلقائيًا."}
          - {name: version, label: الإصدار, widget: string, required: false}
          - {name: download_url, label: "رابط تحميل الـ ZIP", widget: string, required: false, hint: "الملف ~1.7GB: ارفعه على Google Drive أو GitHub Release وحط الرابط هنا. لو فاضي يظهر «رابط التحميل قريبًا»"}
          - {name: file_size, label: "حجم الملف (مثال 1.7 GB)", widget: string, required: false}
          - {name: tagline_ar, label: الوصف بالعربي, widget: text}
          - {name: tagline_en, label: الوصف بالإنجليزي, widget: text}
          - {name: plan_ar, label: اسم الباقة بالعربي, widget: string}
          - {name: plan_en, label: اسم الباقة بالإنجليزي, widget: string}
          - {name: price_ar, label: السعر بالعربي, widget: string}
          - {name: price_en, label: السعر بالإنجليزي, widget: string}
          - {name: period_ar, label: المدة بالعربي, widget: string}
          - {name: period_en, label: المدة بالإنجليزي, widget: string}
          - {name: trial_days, label: أيام التجربة المجانية, widget: number, value_type: int, required: false}
          - {name: subscribe_url, label: "رابط الدفع (Stripe Payment Link)", widget: string, required: false, hint: "الرابط الحالي test mode — بدّله برابط Live"}
          - {name: badge_ar, label: "الشارة فوق العنوان بالعربي", widget: string, required: false}
          - {name: badge_en, label: "الشارة فوق العنوان بالإنجليزي", widget: string, required: false}
          - {name: hero_title_ar, label: العنوان الرئيسي بالعربي, widget: string, required: false}
          - {name: hero_title_en, label: العنوان الرئيسي بالإنجليزي, widget: string, required: false}
          - {name: hero_accent_ar, label: "السطر الذهبي بالعربي", widget: string, required: false}
          - {name: hero_accent_en, label: "السطر الذهبي بالإنجليزي", widget: string, required: false}
          - {name: chips_ar, label: "شريط المزايا بالعربي", widget: list, required: false}
          - {name: chips_en, label: "شريط المزايا بالإنجليزي", widget: list, required: false}
          - {name: cta_title_ar, label: "عنوان الختام بالعربي", widget: string, required: false}
          - {name: cta_title_en, label: "عنوان الختام بالإنجليزي", widget: string, required: false}
          - {name: cta_accent_ar, label: "الجزء الذهبي في الختام بالعربي", widget: string, required: false}
          - {name: cta_accent_en, label: "الجزء الذهبي في الختام بالإنجليزي", widget: string, required: false}
          - {name: cta_text_ar, label: "نص الختام بالعربي", widget: text, required: false}
          - {name: cta_text_en, label: "نص الختام بالإنجليزي", widget: text, required: false}
          - name: faq
            label: الأسئلة الشائعة
            widget: list
            required: false
            summary: "{{fields.q_ar}}"
            fields:
              - {name: q_ar, label: السؤال بالعربي, widget: string}
              - {name: q_en, label: السؤال بالإنجليزي, widget: string}
              - {name: a_ar, label: الإجابة بالعربي, widget: text}
              - {name: a_en, label: الإجابة بالإنجليزي, widget: text}
          - name: features
            label: المميزات
            widget: list
            summary: "{{fields.title_ar}}"
            fields:
              - {name: icon, label: "أيقونة (رمز قصير)", widget: string, required: false}
              - {name: title_ar, label: العنوان بالعربي, widget: string}
              - {name: title_en, label: العنوان بالإنجليزي, widget: string}
              - {name: desc_ar, label: الوصف بالعربي, widget: text}
              - {name: desc_en, label: الوصف بالإنجليزي, widget: text}
          - name: shots
            label: صور الأداة
            widget: list
            summary: "{{fields.caption_ar}}"
            fields:
              - {name: image, label: الصورة, widget: image}
              - {name: caption_ar, label: التعليق بالعربي, widget: string, required: false}
              - {name: caption_en, label: التعليق بالإنجليزي, widget: string, required: false}
              - {name: desc_ar, label: الوصف بالعربي, widget: string, required: false}
              - {name: desc_en, label: الوصف بالإنجليزي, widget: string, required: false}
          - {name: flow_ar, label: "خطوات الاشتراك بالعربي", widget: list, required: false}
          - {name: flow_en, label: "خطوات الاشتراك بالإنجليزي", widget: list, required: false}
          - {name: steps_ar, label: خطوات التثبيت بالعربي, widget: list, required: false}
          - {name: steps_en, label: خطوات التثبيت بالإنجليزي, widget: list, required: false}
