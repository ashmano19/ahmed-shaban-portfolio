<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AHMED SHABAN | Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/images/favicon.png"><link rel="stylesheet" href="/style.css">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script><style>
.dd{position:relative}.ddb{background:none;border:0;color:inherit;opacity:.8;font:inherit;cursor:pointer}.ddb:hover,.dd.open .ddb{opacity:1;color:#CEA111}
.ddm{display:none;position:absolute;top:100%;inset-inline-end:0;margin-top:10px;min-width:260px;max-width:80vw;background:#161616;border:1px solid #CEA111;border-radius:10px;padding:6px;box-shadow:0 10px 30px #000a;z-index:30}
.dd.open .ddm{display:block}@media(hover:hover){.dd:hover .ddm{display:block}.dd:after{content:"";position:absolute;top:100%;height:12px;inset-inline:0}}
.ddm a{display:block;padding:10px 12px;border-radius:6px;opacity:1!important;line-height:1.5;font-size:.95rem}.ddm a:hover{background:#CEA11122;color:#CEA111}
@media(max-width:700px){.ddm{position:fixed;top:70px;inset-inline:12px;max-width:none;margin:0}}
.contact{max-width:600px;margin:auto}.contact a{flex:1 1 220px}.hero{background-position:center}.nav nav a,.ddb{white-space:nowrap}@media(max-width:700px){.nav nav{gap:10px;font-size:.82rem}.logo img{height:40px}}@media(max-width:700px){.hero{height:auto;min-height:0;aspect-ratio:auto;padding:120px 0 60px;background-size:100% auto;background-repeat:no-repeat;background-position:center 64px}.hero-in{margin-top:22vw}}
.grid.feat{columns:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.grid.feat figure{margin:0;aspect-ratio:1/1}.grid.feat img{height:100%;object-fit:cover}@media(max-width:700px){.grid.feat{grid-template-columns:1fr 1fr;gap:10px}}
.hero:before{background:linear-gradient(rgba(15,15,15,.72),rgba(15,15,15,.75) 60%,#0f0f0f)}
</style></head><body>
<header class="nav"><a href="#" class="logo"><img src="/images/logo.png" alt="AHMED SHABAN"></a><nav><a href="#gallery" data-i="gallery"></a><a href="#contact" data-i="contact"></a><div class="dd" id="dd"><button class="ddb" id="ddb" aria-haspopup="true" aria-expanded="false">Download ▾</button><div class="ddm" id="ddm"></div></div><button id="lang">EN</button></nav></header>
<section class="hero" id="hero"><div class="hero-in"><h1 class="hero-logo"><img src="/images/logo.png" alt="AHMED SHABAN"></h1><p id="tagline"></p><a href="#gallery" class="btn" data-i="view"></a></div></section>
<section id="gallery" class="sec"><h2 id="gTitle" data-i="gallery"></h2><button class="back" id="back" hidden></button><div class="grid" id="grid"></div><div class="cards" id="cards"></div></section>
<section id="contact" class="sec"><h2 data-i="contact"></h2><div class="contact" id="contactBox"></div></section>
<footer>© <span id="yr"></span> <span id="fname"></span></footer>
<div class="lb" id="lb"><button class="x" id="lbx">×</button><button class="ar p" id="lbp">‹</button><img id="lbimg" alt=""><p id="lbcap"></p><button class="ar n" id="lbn">›</button></div>
<script src="/app.js"></script>
<script>if(window.netlifyIdentity){netlifyIdentity.on("init",u=>{if(!u)netlifyIdentity.on("login",()=>location.href="/admin/")})}</script>
</body></html>
