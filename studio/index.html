<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الاستوديو | لوحة التحكم</title><meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Cairo,sans-serif;background:#0f0f0f;color:#eee;line-height:1.7;min-height:100vh;padding-bottom:110px}
button{font:inherit;cursor:pointer}a{color:#CEA111}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:12px 4%;background:rgba(15,15,15,.9);backdrop-filter:blur(8px);border-bottom:1px solid #222}
.top img{height:42px}.top h1{font-size:1.1rem;font-weight:700;flex:1}.top .site{font-size:.9rem;opacity:.8}
.wrap{max-width:1300px;margin:auto;padding:24px 4%}
.login{max-width:420px;margin:12vh auto;text-align:center;padding:30px}.login img{height:90px;margin-bottom:20px}.login p{opacity:.8;margin-bottom:24px}
.gold{background:#CEA111;color:#111;border:0;font-weight:700;padding:12px 34px;border-radius:30px;font-size:1.05rem}.gold:disabled{opacity:.4;cursor:default}
.ghost{background:none;border:1px solid #CEA111;color:#CEA111;padding:6px 18px;border-radius:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{color:#eee;position:relative;border-radius:10px;overflow:hidden;aspect-ratio:4/3;background:#1c1c1c;cursor:pointer;border:1px solid #222}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .4s}.card:hover img{transform:scale(1.05)}
.card div{position:absolute;inset:auto 0 0 0;padding:12px 16px;background:linear-gradient(transparent,#000d)}.card b{display:block}.card span{color:#CEA111;font-size:.88rem}
.card i{position:absolute;top:10px;inset-inline-start:10px;background:#CEA111;color:#111;font-style:normal;font-size:.75rem;font-weight:700;padding:1px 9px;border-radius:12px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:18px}.head h2{font-size:1.6rem;flex:1}
.cov{display:flex;align-items:center;gap:10px;font-size:.9rem;opacity:.9}.cov img{width:70px;height:52px;object-fit:cover;border-radius:6px;border:1px solid #CEA111}
.drop{border:2px dashed #CEA11199;border-radius:14px;padding:34px 20px;text-align:center;cursor:pointer;background:#151515;transition:.2s}
.drop.on{background:#CEA11118;border-color:#CEA111}.drop b{display:block;font-size:1.2rem;color:#CEA111}.drop small{opacity:.7}
.opts{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin:14px 0 26px;font-size:.95rem}
.opts label{display:flex;align-items:center;gap:8px;cursor:pointer}.opts input{accent-color:#CEA111;width:18px;height:18px}
h3.sub{font-family:Georgia,serif;letter-spacing:.3em;color:#CEA111;font-size:.95rem;margin:26px 0 10px;display:flex;align-items:center;gap:12px}h3.sub:after{content:"";flex:1;height:1px;background:#CEA11155}
.hint{font-size:.85rem;opacity:.6;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.t{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#1c1c1c;cursor:grab;border:1px solid #222;touch-action:manipulation}
.t img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.t.div{box-shadow:inset -4px 0 0 #CEA111}.t.div:before{content:"مجموعة جديدة";position:absolute;top:6px;right:8px;background:#CEA111;color:#111;font-size:.68rem;font-weight:700;padding:0 7px;border-radius:10px;z-index:2}
.t.new{outline:2px solid #CEA111;outline-offset:-2px}
.t .vb{position:absolute;bottom:6px;right:8px;background:#000a;color:#fff;font-size:.72rem;padding:0 8px;border-radius:10px}
.t .bt{position:absolute;bottom:6px;left:6px;display:flex;gap:5px;opacity:0;transition:.15s}.t:hover .bt,.t:focus-within .bt{opacity:1}
@media(hover:none){.t .bt{opacity:1}}
.t .bt button{width:30px;height:30px;border-radius:50%;border:0;background:#000c;color:#fff;font-size:.9rem;line-height:30px}
.t .bt button:hover{background:#CEA111;color:#111}.t .bt .x:hover{background:#c33;color:#fff}
.ghostT{opacity:.3}.fly{position:fixed;z-index:50;pointer-events:none;opacity:.9;transform:scale(1.05);box-shadow:0 12px 30px #000c;outline:2px solid #CEA111;border-radius:8px;overflow:hidden;aspect-ratio:auto}
.t,.card{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}.card img{pointer-events:none}.card.ghostT{opacity:.3}.card.fly{aspect-ratio:auto}
.bar{position:fixed;bottom:0;inset-inline:0;z-index:20;display:flex;align-items:center;gap:16px;padding:14px 4%;background:#141414ee;backdrop-filter:blur(8px);border-top:1px solid #CEA11166}
.bar .msg{flex:1;font-size:.95rem}.bar .msg b{color:#CEA111}
.prog{height:4px;background:#222;border-radius:4px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;width:0;background:#CEA111;transition:width .2s}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#CEA111;color:#111;font-weight:700;padding:10px 26px;border-radius:30px;z-index:30;box-shadow:0 8px 30px #000a}
.toast.err{background:#c33;color:#fff}
.empty{opacity:.5;padding:16px 0;font-size:.95rem}
@media(max-width:600px){.cards{grid-template-columns:1fr 1fr;gap:10px}.grid{grid-template-columns:repeat(3,1fr);gap:6px}.head h2{font-size:1.25rem}.drop{padding:24px 12px}.top h1{font-size:.95rem}}
[hidden]{display:none!important}.tabs{display:flex;gap:6px;padding:0 4%;background:#111;border-bottom:1px solid #222;overflow-x:auto;position:sticky;top:67px;z-index:9}
.tabs a{padding:12px 18px;color:#bbb;text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;font-weight:700;font-size:.95rem}.tabs a:hover{color:#fff}.tabs a.on{color:#CEA111;border-bottom-color:#CEA111}
.rows{display:flex;flex-direction:column;gap:10px;max-width:980px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:#161616;border:1px solid #262626;border-radius:10px;padding:10px 12px;touch-action:manipulation;-webkit-touch-callout:none}
.row.off{opacity:.5}.row.ghostT{opacity:.3}.row.fly{background:#1c1c1c}.row .hd{cursor:grab;color:#CEA111;font-size:1.2rem;padding:0 6px;user-select:none;-webkit-user-select:none}
.row input:not([type]){flex:1 1 160px;min-width:0}.row .fix{flex:1 1 160px;font-size:.88rem;color:#CEA111;opacity:.85}
.row .x,.xs{width:34px;height:34px;border-radius:50%;border:0;background:#2a2a2a;color:#fff}.row .x:hover{background:#c33}.xs{background:none}
.sw{display:flex;align-items:center;gap:6px;font-size:.9rem;cursor:pointer;white-space:nowrap}.sw input{accent-color:#CEA111;width:18px;height:18px}
input:not([type]),textarea{font:inherit;background:#0f0f0f;color:#eee;border:1px solid #333;border-radius:8px;padding:9px 12px;width:100%}input:not([type]):focus,textarea:focus{outline:none;border-color:#CEA111}
textarea{line-height:1.8;resize:vertical;min-height:260px}
.form{display:flex;flex-direction:column;gap:18px;max-width:980px}.form label,.fl{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.95rem}
.form small{font-weight:400;opacity:.6;font-size:.82rem}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.covbox{display:flex;align-items:center;gap:14px;font-weight:400}.covbox img{width:180px;aspect-ratio:16/10;object-fit:cover;border-radius:8px;border:1px solid #CEA111}
.nocov{display:grid;place-items:center;width:180px;aspect-ratio:16/10;border:1px dashed #444;border-radius:8px;font-size:.85rem;opacity:.6;font-weight:400}
.card .nocov{width:100%;height:100%;border:0}.ghost.red{border-color:#c33;color:#e55}
.tb{display:flex;flex-wrap:wrap;gap:6px;font-weight:400}.tb button{background:#1c1c1c;border:1px solid #333;color:#eee;border-radius:8px;padding:4px 12px;font-size:.88rem}.tb button:hover{border-color:#CEA111;color:#CEA111}.tb span{flex:1}
.pv{background:#111;border:1px solid #333;border-radius:8px;padding:16px 20px;font-weight:400;min-height:260px}.pv img{max-width:100%;display:block;margin:14px auto;border-radius:8px}
.pv h2,.pv h3,.pv h4{color:#CEA111;margin:20px 0 8px}.pv ul{padding-inline-start:22px}.pv b{color:#fff}
@media(max-width:600px){.row input:not([type]){flex:1 1 40%}.row .fix{flex-basis:100%;order:5}.two{grid-template-columns:1fr}.tabs{top:62px}.tabs a{padding:10px 12px;font-size:.88rem}.covbox{flex-direction:column;align-items:flex-start}}
</style></head><body>
<header class="top"><img src="/images/logo.svg" alt=""><h1>الاستوديو</h1><a class="site" href="/" target="_blank">فتح الموقع ↗</a><button class="ghost" id="out" hidden>خروج</button></header>
<nav class="tabs" id="tabs" hidden><a href="#" data-t="cats">القوائم</a><a href="#nav" data-t="nav">القائمة العلوية</a><a href="#dl" data-t="dl">داونلود</a><a href="#set" data-t="set">الإعدادات</a></nav>
<main class="wrap" id="app"><p class="empty">جاري التحميل…</p></main>
<div class="bar" id="bar" hidden><div class="msg"><span id="bmsg"></span><div class="prog" id="prog" hidden><i id="progi"></i></div></div><button class="gold" id="pub">نشر</button></div>
<input type="file" id="fi" multiple accept="image/*,video/mp4,video/quicktime,video/webm" hidden>
<script src="/studio/core.js?v=2"></script>
<script src="/studio/studio.js?v=2"></script>
</body></html>
